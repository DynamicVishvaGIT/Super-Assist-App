<!-- =====================================================================
     FORGOT PASSWORD (v2) - matches the new login page
     Same content and handlers: forgot_data.email, onSendResetLink(),
     isLoading ("Sending..."), showSuccessMessage, backToLogin().
     The previous template is fully commented out at the bottom of this file.
     ===================================================================== -->
<ion-content
  class="forgot-password-page"
  [fullscreen]="true"
  [scrollY]="true"
>
  <span class="fp-glow fp-glow--1"></span>
  <span class="fp-glow fp-glow--2"></span>

  <div class="fp-wrapper">

    <!-- BRAND (same as login) -->
    <header class="fp-brand">
      <div class="fp-logo">
        <svg class="fp-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <g class="fp-bubble fp-bubble--grey">
            <path pathLength="1" d="M58 18 H86 A14 14 0 0 1 100 32 V66 L91 59 Q88 56 83 56 H58 A14 14 0 0 1 44 42 V32 A14 14 0 0 1 58 18 Z" />
          </g>
          <g class="fp-bubble fp-bubble--green">
            <path pathLength="1" d="M34 64 H62 A14 14 0 0 1 76 78 V86 A14 14 0 0 1 62 100 H37 Q32 100 29 103 L20 110 V78 A14 14 0 0 1 34 64 Z" />
          </g>
        </svg>
      </div>
      <div class="fp-brand-text">
        <img src="assets/images/super-assist-wordmark.png" alt="Super Assist" class="fp-wordmark">
        <p class="fp-tagline">Smart enterprise messaging</p>
      </div>
    </header>

    <!-- KEY BADGE + HEADING -->
    <div class="fp-key">
      <span class="fp-key-ring"></span>
      <ion-icon name="key-outline"></ion-icon>
    </div>

    <h1 class="fp-title">Forgot Password?</h1>
    <p class="fp-subtitle">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <!-- EMAIL -->
    <div class="fp-field fp-stagger-1" [class.fp-field--error]="emailError">
      <label>Email Address</label>
      <div class="fp-input" [class.fp-shake]="shakeEmail">
        <ion-icon name="mail-outline" class="fp-input-icon"></ion-icon>
        <ion-input
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          autocorrect="off"
          [spellcheck]="false"
          enterkeyhint="send"
          placeholder="e.g. user@example.com"
          [(ngModel)]="forgot_data.email"
          (ngModelChange)="onEmailChange()"
          (keyup.enter)="onSendResetLink()">
        </ion-input>
      </div>
      <div class="fp-error" *ngIf="emailError">
        <ion-icon name="alert-circle"></ion-icon>
        <span>{{ emailError }}</span>
      </div>
    </div>

    <!-- SEND BUTTON (same look as the login button) -->
    <button
      type="button"
      class="fp-btn fp-stagger-2"
      [class.fp-btn--loading]="isLoading"
      (click)="onSendResetLink()"
      [disabled]="isLoading">
      <span>{{ isLoading ? 'Sending...' : 'Send Reset Link' }}</span>
      <ion-icon name="arrow-forward-outline" *ngIf="!isLoading"></ion-icon>
      <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
    </button>

    <!-- BACK TO LOGIN -->
    <div class="fp-back fp-stagger-3">
      <span class="fp-remember">Remember your password?</span>
      <button type="button" class="fp-back-link" (click)="backToLogin()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Back to Login</span>
      </button>
    </div>

    <!-- SUCCESS CARD (same text as before) -->
    <div class="fp-success" *ngIf="showSuccessMessage">
      <div class="fp-success-icon">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
      </div>
      <div class="fp-success-text">
        <div class="fp-success-title">Check your inbox</div>
        <div class="fp-success-desc">A reset link has been sent to your email.</div>
      </div>
    </div>

    <footer class="fp-footer">
      <small>from</small>
      <strong>DV TECH</strong>
    </footer>
  </div>
</ion-content>
