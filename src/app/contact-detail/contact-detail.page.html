<ion-header class="contact-header">

  <div class="header-row">

    <ion-button
      fill="clear"
      (click)="onBack()"
    >

      <ion-icon
        name="arrow-back-outline"

          height: 24px !important;
          font-size: 24px !important;
          min-width: 24px !important;
          min-height: 24px !important;
          margin-left: 2px;

    </ion-button>

  </div>

</ion-header>

      </div>

        {{ contact?.name || 'Unknown Contact' }}

      <p class="contact-phone">

        {{ contact?.mobile_no || 'Phone number not available' }}

<!-- ========================================= -->
<!-- FULL SCREEN IMAGE VIEWER -->
<!-- ========================================= -->

<div
  class="image-viewer"
  *ngIf="selectedImage"

  (click)="closeMedia()"

  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd($event)"
>


  <!-- CLOSE -->

  <button
    class="image-viewer-close"
    type="button"
    aria-label="Close image"
    (click)="
      closeMedia();
      $event.stopPropagation()
    "
  >

    <ion-icon
      name="close-outline"
    ></ion-icon>

  </button>


  <!-- PREVIOUS -->

  <button
    *ngIf="imageMedia.length > 1"
    class="image-nav-btn prev-btn"
    type="button"
    aria-label="Previous image"
    (click)="
      prevImage();
      $event.stopPropagation()
    "
  >

    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
    >

      <path
        d="M15 6l-6 6 6 6"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>

  </button>


  <!-- NEXT -->

  <button
    *ngIf="imageMedia.length > 1"
    class="image-nav-btn next-btn"
    type="button"
    aria-label="Next image"
    (click)="
      nextImage();
      $event.stopPropagation()
    "
  >

    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
    >

      <path
        d="M9 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>

  </button>


  <!-- IMAGE -->

  <div
    class="image-viewer-content"
    (click)="$event.stopPropagation()"
  >

    <img
      [src]="selectedImage"
      [class]="'full-screen-image ' + slideClass"
      alt="Shared Media Preview"
    >

  </div>


  <!-- COUNTER -->

  <div
    class="image-counter"
    *ngIf="imageMedia.length > 1"
  >

    {{ selectedIndex! + 1 }} /
    {{ imageMedia.length }}

  </div>

</div>
