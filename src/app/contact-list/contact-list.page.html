<ion-header class="chat-detail-header">
  <ion-toolbar>
    <div class="header-chat-row">
      <ion-icon name="arrow-back-outline" class="back" (click)="goBack()" style="font-size: 24px !important; color: #111b21 !important; cursor: pointer; margin-left: 8px; margin-top: 20px;"></ion-icon>
      <div class="chat-user">
        <h2 class="chat-user-name" style="color: #00A859 !important; font-weight: 600 !important; margin: 0; font-size: 25px; margin-left: 20px; margin-top: 20px;">Select Contact</h2>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-bg">
  <!-- Search Bar -->
  <div class="search-container">
    <div class="input-container">
      <ion-icon name="search-outline"></ion-icon>
      <input 
        type="text" 
        placeholder="Search name or number..." 
        [(ngModel)]="searchQuery" 
        (input)="filterContacts()" />
    </div>
  </div>

  <!-- Contact List -->
  <div class="contacts-list-wrapper">
    <div class="contact-card" *ngFor="let contact of filteredContacts" (click)="selectContact(contact)">
      <div class="contact-avatar">
        {{ getInitials(contact.name) }}
      </div>
      <div class="contact-details">
        <div class="contact-name">{{ contact.name }}</div>
        <div class="contact-number">{{ contact.phone }}</div>
      </div>
      <div class="contact-actions-inline">
        <button class="action-icon-btn call-btn" (click)="callContact(contact, $event)" title="Call">
          <img src="assets/images/call.png" alt="Call" style="width: 18px !important; height: 18px !important; min-width: 20px !important; min-height: 20px !important; object-fit: contain !important; background-color: #ffffff !important;">
        </button>
        <button class="action-icon-btn message message-btn" (click)="messageContact(contact, $event)" title="Message">
          <img src="assets/images/message.png" alt="Message" style="width: 18px !important; height: 18px !important; min-width: 20px !important; min-height: 20px !important; object-fit: contain !important;background-color: #ffffff !important;">
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="filteredContacts.length === 0">
      <p>No contacts found</p>
    </div>
  </div>
</ion-content>
