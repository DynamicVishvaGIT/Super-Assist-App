<ion-header class="chat-detail-header">
  <ion-toolbar>
    <div class="header-chat-row">

      <!-- Back Button -->
      <ion-icon
        name="arrow-back-outline"
        class="back"
        (click)="goBack()">
      </ion-icon>

      <div class="chat-user">
        <h2 class="chat-user-name">
          Select Contact
        </h2>
      </div>

    </div>
  </ion-toolbar>
</ion-header>


<ion-content
  class="chat-bg"
  [scrollEvents]="true">

  <!-- =========================
       Search Bar
  ========================== -->
  <div class="search-container">

    <div class="input-container">

      <ion-icon name="search-outline"></ion-icon>

      <input
        type="text"
        placeholder="Search name or number..."
        [(ngModel)]="searchQuery"
        (input)="filterContacts()" />

      <!-- Clear Search -->
      <ion-icon
        *ngIf="searchQuery"
        name="close-circle"
        class="clear-search"
        (click)="clearSearch()">
      </ion-icon>

    </div>

  </div>


  <!-- =========================
       Contact List
  ========================== -->
  <div class="contacts-list-wrapper">

    <div
      class="contact-card"
      *ngFor="let contact of visibleContacts; trackBy: trackByContactId"
      ><!--(click)="selectContact(contact)"-->

      <!-- Avatar -->
      <div class="contact-avatar">
        {{ getInitials(contact.name) }}
      </div>


      <!-- Contact Details -->
      <div class="contact-details">

        <div class="contact-name">
          {{ contact.name || 'Unknown Contact' }}
        </div>

        <div class="contact-number">
          {{ contact.phone }}
        </div>

      </div>


      <!-- Message Button -->
      <div class="contact-actions-inline">

        <button
        type="button"
        class="action-icon-btn message-btn"
        [disabled]="contact.loadingConversation"
        (click)="openMessageForContact(contact, $event)"
        title="Message">

        <ion-spinner
          *ngIf="contact.loadingConversation"
          name="crescent">
        </ion-spinner>

        <img
          *ngIf="!contact.loadingConversation"
          src="assets/images/message.png"
          alt="Message"
          class="action-icon-img">

      </button>
        <!-- <button
          type="button"
          class="action-icon-btn message-btn"
          [disabled]="contact.loadingConversation"
          (click)="openMessageForContact(contact, $event)"
          title="Message">

          <ion-spinner
            *ngIf="contact.loadingConversation"
            name="crescent">
          </ion-spinner>

          <img
            *ngIf="!contact.loadingConversation"
            src="assets/images/message.png"
            alt="Message"
            class="action-icon-img">

        </button> -->

      </div>

    </div>


    <!-- =========================
         Empty State
    ========================== -->
    <div
      class="empty-state"
      *ngIf="visibleContacts.length === 0">

      <ion-icon name="people-outline"></ion-icon>

      <p>
        {{ searchQuery ? 'No contacts found' : 'No contacts available' }}
      </p>

    </div>


    <!-- =========================
         Loading More
    ========================== -->
    <div
      class="load-more-loader"
      *ngIf="isLoadingMore">

      <ion-spinner name="crescent"></ion-spinner>

      <span>Loading more contacts...</span>

    </div>

  </div>


  <!-- =========================
       Ionic Infinite Scroll
  ========================== -->
  <ion-infinite-scroll
    threshold="150px"
    [disabled]="isInfiniteScrollDisabled"
    (ionInfinite)="loadMoreContacts($event)">

    <ion-infinite-scroll-content
      loadingSpinner="crescent"
      loadingText="Loading more contacts...">
    </ion-infinite-scroll-content>

  </ion-infinite-scroll>

</ion-content>
